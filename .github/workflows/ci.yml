name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Frontend-only CI: typecheck + lint + build. No tests (none exist by design,
# Chunk 00 decision). No deploy step — Vercel handles the frontend deploy on
# push to main; backend deploys are manual via `backend/scripts/deploy.sh`
# (Chunk 13 decisions).
#
# Placeholder VITE_* env vars are passed to the build step so the Zod env
# validation in `src/constants/env.ts` passes — real values come from Vercel's
# project env vars at actual deploy time. This means the CI build verifies
# compilation, not deployability against a real Supabase.

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_APP_NAME: ContentEngine
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder
